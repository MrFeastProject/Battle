<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>MrFeastProject · Cosmic Battle</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Unbounded:wght@400;700;900&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
        html, body { overscroll-behavior: none; width: 100%; height: 100%; overflow: hidden; position: fixed; }
        body { background: #030308; font-family: 'Orbitron', sans-serif; color: white; }

        /* === INTRO === */
        #intro {
            position: fixed; inset: 0; background: #000;
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; flex-direction: column;
            padding: 5vw; overflow: hidden;
        }
        #intro.hidden { display: none; }
        .intro-stack {
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(8px, 1.5vh, 16px); width: 100%;
        }
        .intro-text {
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            font-size: clamp(28px, 11vw, 90px);
            letter-spacing: clamp(1px, 0.5vw, 6px);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            line-height: 1;
            white-space: nowrap;
        }
        .intro-letter {
            opacity: 0;
            transform: translateY(-60px) rotateX(180deg) scale(0.2);
            filter: blur(20px);
            display: inline-block;
            text-shadow: 0 0 20px #0ff, 0 0 40px #0ff;
            will-change: transform, opacity, filter;
        }
        .intro-letter.animate {
            animation: letterAssemble 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }
        @keyframes letterAssemble {
            0% { opacity: 0; transform: translateY(-60px) rotateX(180deg) scale(0.2); filter: blur(20px); }
            60% { opacity: 1; transform: translateY(8px) rotateX(0deg) scale(1.08); filter: blur(0); }
            100% { opacity: 1; transform: translateY(0) rotateX(0deg) scale(1); filter: blur(0); }
        }
        .intro-project {
            display: block;
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            font-size: clamp(18px, 6vw, 44px);
            letter-spacing: clamp(2px, 1vw, 8px);
            color: #b044ff;
            text-shadow: 0 0 20px #b044ff, 0 0 60px #b044ff;
            opacity: 0;
            transform: translateY(-100px) scale(0.5);
            will-change: transform, opacity;
            line-height: 1;
        }
        .intro-project.falling {
            animation: projectFall 0.9s cubic-bezier(0.5, 1.6, 0.5, 1) forwards;
        }
        @keyframes projectFall {
            0% { opacity: 0; transform: translateY(-100px) scale(0.5) rotate(-20deg); }
            70% { opacity: 1; transform: translateY(15px) scale(1.15) rotate(3deg); }
            100% { opacity: 1; transform: translateY(0) scale(1) rotate(0); }
        }
        .intro-present {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(11px, 2.8vw, 22px);
            letter-spacing: clamp(4px, 1.5vw, 18px);
            color: #0ff;
            text-shadow: 0 0 15px #0ff;
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1s, transform 1s;
            text-align: center;
            line-height: 1;
            margin-top: clamp(20px, 5vh, 50px);
        }
        .intro-present.show { opacity: 1; transform: translateY(0); }
        .intro-present.fade { opacity: 0; transform: translateY(-20px); }
        .intro-glow {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, rgba(0,255,255,0.15), transparent 60%);
            animation: pulseGlow 2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes pulseGlow { 0%,100% { opacity: 0.3; } 50% { opacity: 1; } }

        /* === MENU === */
        #main-menu {
            position: fixed; inset: 0; z-index: 300;
            display: none;
            flex-direction: column;
            align-items: center; justify-content: center;
            gap: 2vh;
            padding: 5vw;
            padding-top: max(5vw, env(safe-area-inset-top, 20px));
            padding-bottom: max(5vw, env(safe-area-inset-bottom, 20px));
            background: radial-gradient(circle at center, #1a0b2e 0%, #000 80%);
            overflow: hidden;
        }
        #main-menu.show { display: flex; }
        #menu-canvas { position: absolute; inset: 0; z-index: 0; }
        .menu-content {
            position: relative; z-index: 2;
            display: flex; flex-direction: column; align-items: center;
            gap: clamp(8px, 1.5vh, 14px);
            width: 100%; max-width: 340px;
        }
        .menu-title {
            font-family: 'Unbounded', sans-serif;
            font-weight: 900;
            font-size: clamp(26px, 8vw, 48px);
            letter-spacing: clamp(2px, 1vw, 4px);
            line-height: 1.05;
            background: linear-gradient(180deg, #fff, #0ff 50%, #0088ff);
            -webkit-background-clip: text; background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 25px rgba(0,255,255,0.7));
            text-align: center;
        }
        .menu-sub {
            font-size: clamp(9px, 2.5vw, 11px);
            letter-spacing: clamp(3px, 1.5vw, 8px);
            color: #0ff;
            opacity: 0.7;
            margin-bottom: clamp(10px, 2vh, 26px);
            text-align: center;
        }
        .menu-btn {
            width: 100%;
            padding: clamp(12px, 2vh, 18px);
            background: linear-gradient(135deg, rgba(0,255,255,0.1), rgba(176,68,255,0.1));
            border: 2px solid #0ff; border-radius: 14px;
            color: #0ff;
            font-family: 'Unbounded', sans-serif;
            font-weight: 700;
            font-size: clamp(12px, 3.5vw, 16px);
            letter-spacing: clamp(1px, 0.5vw, 3px);
            cursor: pointer; transition: 0.2s;
            box-shadow: 0 0 20px rgba(0,255,255,0.3);
            display: flex; align-items: center; justify-content: center; gap: 12px;
            flex-direction: row;
        }
        .menu-btn:active { transform: scale(0.96); }
        .menu-btn.purple { border-color: #b044ff; color: #b044ff; box-shadow: 0 0 20px rgba(176,68,255,0.3); }
        .menu-btn.gold { border-color: #ffd700; color: #ffd700; box-shadow: 0 0 20px rgba(255,215,0,0.3); }
        .menu-btn.soon {
            opacity: 0.35; cursor: not-allowed;
            border-color: #555 !important; color: #777 !important;
            box-shadow: none !important;
            flex-direction: column; gap: 4px;
        }
        .menu-btn.soon:active { transform: none; }
        .menu-btn .soon-sub {
            font-size: clamp(8px, 2vw, 10px);
            letter-spacing: 1px; color: #888;
            font-family: 'Orbitron', sans-serif; font-weight: 400;
        }

        /* === GAME === */
        canvas#gameCanvas { display: none; position: fixed; inset: 0; width: 100%; height: 100%; }
        canvas#gameCanvas.show { display: block; }
        .hud-panel {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 10px);
            left: 10px; right: 10px;
            background: rgba(8, 8, 20, 0.85);
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 8px 12px;
            backdrop-filter: blur(6px);
            clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
            display: none;
            align-items: center; gap: 10px;
            z-index: 10;
            justify-content: space-between;
            flex-wrap: wrap;
        }
        .hud-panel.show { display: flex; }
        .stat-group { display: flex; gap: 10px; }
        .stat-item { display: flex; align-items: center; gap: 4px; font-size: clamp(11px, 3vw, 14px); font-weight: 700; }
        .stat-val { color: #0ff; text-shadow: 0 0 8px #0ff; font-size: clamp(13px, 3.5vw, 17px); }
        .stat-icon { font-size: clamp(14px, 4vw, 18px); }

        #boss-bar-container {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 60px);
            left: 10%; width: 80%; height: 8px;
            background: #1a1a1a; border: 1px solid #ff0055;
            display: none; z-index: 10;
        }
        #boss-bar-container.show { display: block; }
        #boss-bar-fill { height: 100%; background: linear-gradient(90deg, #ff0055, #ff5500); width: 100%; box-shadow: 0 0 10px #ff0055; }

        #side-controls {
            position: fixed;
            right: calc(env(safe-area-inset-right, 0px) + 10px);
            top: 50%; transform: translateY(-50%);
            display: none; flex-direction: column;
            gap: clamp(6px, 1.5vh, 12px);
            z-index: 20;
        }
        #side-controls.show { display: flex; }
        .btn-icon {
            width: clamp(44px, 12vw, 52px);
            height: clamp(44px, 12vw, 52px);
            background: rgba(0, 20, 40, 0.7);
            border: 2px solid #0ff; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s ease;
            backdrop-filter: blur(4px);
            box-shadow: 0 0 15px rgba(0,255,255,0.3);
            color: #0ff;
            font-size: clamp(16px, 4.5vw, 20px);
        }
        .btn-icon:active { transform: scale(0.88); }

        #ability-panel {
            position: fixed;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
            left: 0; right: 0;
            display: none;
            flex-direction: column; align-items: center;
            gap: 8px;
            z-index: 25;
            pointer-events: none;
        }
        #ability-panel.show { display: flex; }
        #ability-row { display: flex; gap: clamp(12px, 4vw, 18px); pointer-events: auto; }
        .ability-btn {
            position: relative;
            width: clamp(60px, 17vw, 74px);
            height: clamp(60px, 17vw, 74px);
            background: rgba(8, 8, 25, 0.85);
            border: 2px solid #0ff; border-radius: 14px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.15s;
            box-shadow: 0 0 18px rgba(0,255,255,0.4);
            backdrop-filter: blur(6px);
            color: #0ff;
            overflow: hidden;
        }
        .ability-btn i { font-size: clamp(20px, 6vw, 26px); filter: drop-shadow(0 0 8px currentColor); }
        .ability-btn .key-label { position: absolute; top: 3px; left: 6px; font-size: 9px; opacity: 0.6; }
        .ability-btn .cd-label { position: absolute; bottom: 3px; right: 6px; font-size: 10px; font-weight: 700; color: #fff; text-shadow: 0 0 4px #000; }
        .ability-btn:active { transform: scale(0.9); }
        .ability-btn.locked::after { content: '\f023'; font-family: 'Font Awesome 6 Free'; font-weight: 900; position: absolute; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; font-size: 22px; color: #888; }
        .ability-btn .cd-overlay { position: absolute; bottom: 0; left: 0; right: 0; background: rgba(255, 0, 85, 0.5); transition: height 0.05s linear; pointer-events: none; }
        .ability-btn.firing { animation: pulse-ability 0.3s; }
        @keyframes pulse-ability { 0%{transform:scale(1);} 50%{transform:scale(1.15);} 100%{transform:scale(1);} }

        #auto-btn {
            pointer-events: auto;
            padding: 6px 16px; border-radius: 12px;
            background: rgba(8, 8, 25, 0.85);
            border: 2px solid #555; color: #aaa;
            font-family: 'Orbitron'; font-weight: 700;
            font-size: clamp(9px, 2.8vw, 11px);
            letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            display: flex; align-items: center; gap: 6px;
        }
        #auto-btn.active { border-color: #0f0; color: #0f0; box-shadow: 0 0 20px rgba(0,255,0,0.5); background: rgba(0, 40, 0, 0.6); }

        /* MODALS */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(2, 2, 8, 0.95);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center; align-items: center;
            z-index: 100;
            padding: max(12px, env(safe-area-inset-top, 12px)) 12px max(12px, env(safe-area-inset-bottom, 12px)) 12px;
            overflow-y: auto;
            pointer-events: none;
        }
        .modal-overlay.show { display: flex; pointer-events: auto; }
        .modal-window {
            width: 100%; max-width: min(460px, 94vw);
            max-height: 90vh;
            background: linear-gradient(180deg, #0d0d1f, #050510);
            border: 2px solid #b044ff;
            padding: 3px;
            box-shadow: 0 0 40px rgba(176, 68, 255, 0.35);
            clip-path: polygon(15px 0, 100% 0, 100% calc(100% - 15px), calc(100% - 15px) 100%, 0 100%, 0 15px);
            margin: auto;
            display: flex; flex-direction: column;
        }
        .modal-content {
            padding: clamp(14px, 4vw, 22px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }
        .modal-header {
            font-size: clamp(15px, 4.5vw, 20px);
            color: #b044ff;
            text-transform: uppercase;
            letter-spacing: clamp(1px, 0.8vw, 3px);
            margin-bottom: 18px; text-align: center;
            border-bottom: 1px solid rgba(176, 68, 255, 0.4);
            padding-bottom: 12px;
            text-shadow: 0 0 12px #b044ff;
        }
        .shop-grid { display: flex; flex-direction: column; gap: 10px; }
        .shop-item {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.12);
            padding: clamp(10px, 3vw, 14px);
            display: flex; justify-content: space-between; align-items: center;
            border-radius: 4px; gap: 10px;
        }
        .item-info { flex: 1; min-width: 0; }
        .item-info h4 { color: #fff; font-size: clamp(11px, 3.2vw, 13px); margin-bottom: 4px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .item-info p { color: #999; font-size: clamp(9px, 2.6vw, 11px); font-family: sans-serif; }
        .item-lvl { color: #0ff; font-size: clamp(9px, 2.6vw, 11px); margin-left: auto; }
        .btn-buy { background: transparent; border: 1px solid #ffd700; color: #ffd700; padding: clamp(8px, 2.5vw, 10px) clamp(10px, 3vw, 14px); font-family: 'Orbitron'; font-weight: bold; font-size: clamp(10px, 2.8vw, 11px); cursor: pointer; min-width: clamp(60px, 18vw, 70px); text-align: center; }
        .btn-buy:disabled { border-color: #444; color: #555; }

        .rarity-common { color: #aaa; }
        .rarity-rare { color: #00ccff; }
        .rarity-super { color: #b044ff; }
        .rarity-legend { color: #ffaa00; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 0.85; } 50% { opacity: 1; } }
        .case-display { text-align: center; padding: 14px 0; }
        .case-img { width: clamp(70px, 20vw, 90px); height: clamp(70px, 20vw, 90px); margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; font-size: clamp(50px, 15vw, 70px); animation: float 2.5s ease-in-out infinite; }
        .case-name { font-size: clamp(17px, 5vw, 22px); font-weight: 900; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 2px; }
        @keyframes float { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-12px) rotate(3deg); } }

        .index-tabs { display: flex; gap: 6px; margin-bottom: 14px; }
        .index-tab { flex: 1; padding: 10px 6px; text-align: center; font-size: clamp(9px, 2.6vw, 11px); font-weight: 700; letter-spacing: 1px; cursor: pointer; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; color: #999; }
        .index-tab.active { background: rgba(0,255,255,0.15); border-color: #0ff; color: #0ff; }
        .index-list { display: flex; flex-direction: column; gap: 8px; }
        .index-card { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; cursor: pointer; }
        .index-card.unlocked { border-color: rgba(0,255,255,0.4); background: rgba(0,255,255,0.05); }
        .index-card.locked { opacity: 0.5; }
        .index-card-icon { width: 40px; height: 40px; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; background: rgba(0,0,0,0.4); border-radius: 8px; }
        .index-card-info { flex: 1; min-width: 0; }
        .index-card-info h5 { font-size: clamp(11px, 3vw, 13px); margin-bottom: 3px; }
        .index-card-info p { font-size: clamp(9px, 2.4vw, 10px); color: #888; font-family: sans-serif; }
        .index-card-status { font-size: 10px; padding: 3px 8px; border-radius: 8px; background: rgba(0,255,0,0.15); color: #0f0; }
        .index-card-status.locked { background: rgba(255,255,255,0.08); color: #666; }

        #ship-builder { padding: 8px 0; background: rgba(0,0,0,0.4); border-radius: 12px; margin-bottom: 12px; }
        .builder-canvas { width: 100%; height: clamp(140px, 35vw, 200px); display: block; }
        .builder-slots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
        .builder-slot {
            width: clamp(38px, 11vw, 44px);
            height: clamp(38px, 11vw, 44px);
            border-radius: 8px;
            border: 2px dashed rgba(0,255,255,0.3);
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(14px, 4vw, 18px); cursor: pointer; color: #0ff;
        }
        .builder-slot.filled { border-style: solid; border-color: #0ff; background: rgba(0,255,255,0.15); }
        .builder-slot.active { box-shadow: 0 0 15px #0ff; border-color: #fff; }
        .builder-slot.locked { opacity: 0.3; cursor: pointer; border-color: #ffd700; color: #ffd700; }
        .weapon-pick-list { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
        .weapon-pick {
            width: clamp(34px, 9vw, 40px);
            height: clamp(34px, 9vw, 40px);
            border-radius: 6px;
            border: 1px solid rgba(0,255,255,0.3);
            background: rgba(0,0,0,0.5);
            display: flex; align-items: center; justify-content: center;
            font-size: clamp(13px, 4vw, 16px); cursor: pointer; color: #0ff;
        }
        .weapon-pick.locked { opacity: 0.3; cursor: not-allowed; }
        .weapon-pick.selected { border-color: #fff; background: rgba(0,255,255,0.3); }

        .quest-item { display: flex; align-items: center; gap: 10px; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; margin-bottom: 8px; }
        .quest-item.done { border-color: rgba(0,255,0,0.4); background: rgba(0,255,0,0.08); }
        .quest-icon { width: 38px; height: 38px; border-radius: 8px; background: rgba(0,255,255,0.15); display: flex; align-items: center; justify-content: center; color: #0ff; font-size: 16px; flex: none; }
        .quest-info { flex: 1; min-width: 0; }
        .quest-info h5 { font-size: clamp(10px, 2.8vw, 12px); margin-bottom: 4px; }
        .quest-progress { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; overflow: hidden; margin-top: 4px; }
        .quest-progress i { display: block; height: 100%; background: linear-gradient(90deg, #0ff, #b044ff); transition: width 0.3s; }
        .quest-reward { font-size: clamp(9px, 2.6vw, 11px); color: #ffd700; font-weight: 700; text-align: right; }
        .quest-claim { margin-top: 4px; padding: 4px 10px; background: rgba(0,255,0,0.2); border: 1px solid #0f0; color: #0f0; border-radius: 6px; font-size: clamp(8px, 2.2vw, 10px); font-family: 'Orbitron'; font-weight: 700; cursor: pointer; }
        .quest-claim:disabled { opacity: 0.3; cursor: not-allowed; }

        .profile-avatar {
            width: clamp(80px, 22vw, 100px);
            height: clamp(80px, 22vw, 100px);
            border-radius: 50%; margin: 0 auto 16px;
            background: conic-gradient(from 200deg, #7c3aed, #d946ef, #7c3aed);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Unbounded'; font-weight: 800;
            font-size: clamp(28px, 9vw, 36px);
            border: 3px solid rgba(217,70,239,0.6);
            box-shadow: 0 0 30px rgba(168,85,247,0.6);
            overflow: hidden;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-name { font-family: 'Unbounded'; font-size: clamp(15px, 4.5vw, 20px); font-weight: 800; text-align: center; margin-bottom: 4px; }
        .profile-username { font-size: clamp(11px, 3.2vw, 14px); color: #a78bfa; text-align: center; margin-bottom: 20px; }
        .profile-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; margin-bottom: 8px; background: rgba(30,15,60,0.5); border: 1px solid rgba(139,92,246,0.2); font-size: clamp(11px, 3vw, 13px); }
        .profile-row i { color: #c084fc; width: 18px; text-align: center; }
        .profile-row .k { color: #8b7bb8; }
        .profile-row .v { color: #e9d5ff; font-weight: 600; word-break: break-all; }

        #game-over-screen { background: rgba(40, 0, 0, 0.95); }
        #pause-screen { background: rgba(0, 0, 20, 0.95); }
        .go-title { color: #ff0055; font-size: clamp(24px, 7vw, 32px); text-shadow: 0 0 25px #ff0055; margin-bottom: 20px; text-align: center; font-family: 'Unbounded'; line-height: 1.1; }
        .pause-title { color: #0ff; font-size: clamp(24px, 7vw, 32px); text-shadow: 0 0 25px #0ff; margin-bottom: 20px; text-align: center; font-family: 'Unbounded'; }
        .pause-menu { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; margin: 0 auto; }
        .pause-menu .menu-btn { padding: clamp(11px, 2vh, 14px); font-size: clamp(11px, 3.2vw, 14px); }

        #save-indicator {
            position: fixed;
            top: calc(env(safe-area-inset-top, 0px) + 68px);
            right: 12px;
            font-size: 10px; color: #0ff;
            opacity: 0; transition: opacity 0.3s;
            z-index: 30; letter-spacing: 2px; pointer-events: none;

// === SERVICE WORKER REGISTRATION ===
// ============================================================
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered'))
            .catch(err => console.log('SW registration failed'));

// ============================================================
// === INDEXED DB FOR SPRITES ===
// ============================================================
const DB_NAME = 'CosmicBattleAssets';
const DB_VERSION = 1;
const STORE_NAME = 'sprites';

function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        request.onsuccess = (event) => resolve(event.target.result);
        request.onerror = (event) => reject(event.target.error);
    });
}

async function saveSpriteToDB(key, dataUrl) {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(dataUrl, key);
        return new Promise((resolve, reject) => {
            tx.oncomplete = () => resolve();
            tx.onerror = () => reject(tx.error);
        });
    } catch (e) { console.warn('DB Save Error', e); }
}

async function loadSpriteFromDB(key) {
    try {
        const db = await openDB();
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.get(key);
        return new Promise((resolve, reject) => {
            request.onsuccess = () => resolve(request.result);
            request.onerror = () => reject(request.error);
        });
    } catch (e) { return null; }
}

document.addEventListener('pointerdown', function onceFS() {

const $ = id => document.getElementById(id);

// === INTRO ===
// ============================================================
(function runIntro() {
    const intro = $('intro');
    const mrfeastEl = $('intro-mrfeast');
    const projectEl = $('intro-project');
    const presentEl = $('intro-present');
    const letters = 'MrFeast'.split('');

        s.className = 'intro-letter';
        s.textContent = ch;
        mrfeastEl.appendChild(s);
        setTimeout(() => s.classList.add('animate'), 200 + i * 150);

    setTimeout(() => presentEl.classList.add('show'), T1 + 900);
    setTimeout(() => presentEl.classList.add('fade'), T1 + 900 + 2500);

        intro.classList.add('hidden');
        showMenu();
    }, T1 + 900 + 2500 + 600);
})();

function showMenu() {
    $('main-menu').classList.add('show');
    initMenuAnimation();
}

// ============================================================
// === MENU BG ANIMATION ===
// ============================================================
let menuAnim = null;
function initMenuAnimation() {
    if (menuAnim) return;
    const mc = $('menu-canvas');
    const mctx = mc.getContext('2d');
    let mW, mH;
    function mresize() {
        mW = mc.width = window.innerWidth;
        mH = mc.height = window.innerHeight;
    }
    mresize();
    window.addEventListener('resize', mresize);

    const fighter = { x: mW * 0.3, y: mH * 0.5, angle: 0, fireCd: 0 };
    const mBullets = [], mEnemies = [], mParticles = [], mStars = [];
    for (let i = 0; i < 80; i++) mStars.push({ x: Math.random() * mW, y: Math.random() * mH, s: Math.random() * 2 + 0.4, speed: Math.random() * 1.5 + 0.3 });

    function spawnMob() {
        if (Math.random() < 0.03 && mEnemies.length < 5) {
            mEnemies.push({ x: Math.random() * mW, y: -50, vy: 0.6 + Math.random() * 0.8, size: 24 + Math.random() * 16, hp: 2 + Math.floor(Math.random() * 3), color: Math.random() < 0.5 ? '#0f0' : '#ff0055' });
        }
    }
    let lastT = 0;
    function mloop(t) {
        if (!menuAnim) return;
        menuAnim = requestAnimationFrame(mloop);
        if (document.hidden) return;
        if (t - lastT < 16) return;
        lastT = t;

        const bgGrad = mctx.createLinearGradient(0, 0, 0, mH);
        bgGrad.addColorStop(0, '#030308'); bgGrad.addColorStop(0.5, '#0a0518'); bgGrad.addColorStop(1, '#030308');
        mctx.fillStyle = bgGrad; mctx.fillRect(0, 0, mW, mH);
        for (const s of mStars) {
            s.y += s.speed; if (s.y > mH) { s.y = 0; s.x = Math.random() * mW; }
            mctx.fillStyle = `rgba(255,255,255,${0.3 + Math.random() * 0.4})`;
            mctx.fillRect(s.x, s.y, s.s, s.s);
        }
        fighter.angle = Math.sin(t / 1500) * 0.3;
        fighter.x = mW * 0.15 + Math.sin(t / 2000) * mW * 0.15;
        fighter.y = mH * 0.5 + Math.sin(t / 800) * 60;
        if (--fighter.fireCd <= 0) {
            fighter.fireCd = 12 + Math.random() * 8;
            const angle = -Math.PI / 2 + fighter.angle;
            mBullets.push({ x: fighter.x, y: fighter.y - 15, vx: Math.cos(angle) * 8, vy: Math.sin(angle) * 8 });
        }
        spawnMob();
        for (let i = mBullets.length - 1; i >= 0; i--) {
            const b = mBullets[i];
            b.x += b.vx; b.y += b.vy;
            if (b.y < -20 || b.x < -20 || b.x > mW + 20) { mBullets.splice(i, 1); continue; }
            for (let j = mEnemies.length - 1; j >= 0; j--) {
                const e = mEnemies[j];
                if (Math.hypot(b.x - e.x, b.y - e.y) < e.size) {
                    e.hp--;
                    for (let k = 0; k < 6; k++) {
                        const a = Math.random() * Math.PI * 2;
                        mParticles.push({ x: e.x, y: e.y, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, life: 1, color: e.color });
                    }
                    if (e.hp <= 0) mEnemies.splice(j, 1);
                    mBullets.splice(i, 1);
                    break;
                }
            }
        }
        for (let i = mEnemies.length - 1; i >= 0; i--) {
            const e = mEnemies[i];
            e.y += e.vy;
            if (e.y > mH + 50) mEnemies.splice(i, 1);
        }
        mctx.shadowBlur = 15; mctx.shadowColor = '#0ff';
        for (const b of mBullets) {
            mctx.fillStyle = '#0ff';
            mctx.beginPath(); mctx.arc(b.x, b.y, 4, 0, 7); mctx.fill();
        }
        for (const e of mEnemies) {
            mctx.shadowBlur = 15; mctx.shadowColor = e.color;
            mctx.fillStyle = e.color;
            mctx.beginPath(); mctx.arc(e.x, e.y, e.size / 2, 0, 7); mctx.fill();
            mctx.fillStyle = '#000';
            mctx.beginPath(); mctx.arc(e.x - 5, e.y - 3, 3, 0, 7); mctx.fill();
            mctx.beginPath(); mctx.arc(e.x + 5, e.y - 3, 3, 0, 7); mctx.fill();
        }
        mctx.save();
        mctx.translate(fighter.x, fighter.y);
        mctx.rotate(fighter.angle);
        mctx.shadowBlur = 25; mctx.shadowColor = '#0ff';
        mctx.fillStyle = '#0af';
        mctx.beginPath();
        mctx.moveTo(0, -22); mctx.lineTo(20, 5); mctx.lineTo(12, 18); mctx.lineTo(0, 10);
        mctx.lineTo(-12, 18); mctx.lineTo(-20, 5); mctx.closePath(); mctx.fill();
        mctx.fillStyle = '#fff'; mctx.shadowBlur = 10;
        mctx.beginPath(); mctx.arc(0, 8, 4, 0, 7); mctx.fill();
        mctx.fillStyle = 'rgba(255,0,255,0.8)'; mctx.shadowColor = '#ff00ff'; mctx.shadowBlur = 20;
        mctx.beginPath(); mctx.moveTo(-5, 14); mctx.lineTo(0, 26 + Math.random() * 6); mctx.lineTo(5, 14); mctx.closePath(); mctx.fill();
        mctx.restore();
        for (let i = mParticles.length - 1; i >= 0; i--) {
            const p = mParticles[i];
            p.x += p.vx; p.y += p.vy; p.vx *= 0.95; p.vy *= 0.95; p.life -= 0.03;
            if (p.life <= 0) { mParticles.splice(i, 1); continue; }
            mctx.globalAlpha = p.life;
            mctx.shadowBlur = 12; mctx.shadowColor = p.color;
            mctx.fillStyle = p.color;
            mctx.beginPath(); mctx.arc(p.x, p.y, 3 * p.life, 0, 7); mctx.fill();
        }
        mctx.globalAlpha = 1; mctx.shadowBlur = 0;
    }
    menuAnim = requestAnimationFrame(mloop);
    window._stopMenuAnim = () => { if (menuAnim) { cancelAnimationFrame(menuAnim); menuAnim = null; } };
}

function loadGame() {
    try {
        const saved = localStorage.getItem(SAVE_KEY);
        if (saved) {
            const p = JSON.parse(saved);
            STATE = { ...DEFAULT_STATE, ...p };
            STATE.upgrades = { ...DEFAULT_STATE.upgrades, ...(p.upgrades || {}) };
            STATE.unlockedAbilities = p.unlockedAbilities || ['rocketStrike'];
            STATE.equippedAbilities = p.equippedAbilities || ['rocketStrike', null];
            STATE.unlockedWeapons = p.unlockedWeapons || ['basic', 'rocket'];
            STATE.weaponSlots = p.weaponSlots || [null, null, 'basic', null, null];
            STATE.slotUnlocked = p.slotUnlocked || [false, false, true, false, false];
            
            if (!STATE.unlockedAbilities.includes('rocketStrike')) STATE.unlockedAbilities.push('rocketStrike');
            if (!STATE.equippedAbilities[0]) STATE.equippedAbilities[0] = 'rocketStrike';
            if (!STATE.weaponSlots[2]) STATE.weaponSlots[2] = 'basic';
            STATE.slotUnlocked[2] = true;
            
            if (p.quests) for (const k in DEFAULT_STATE.quests) if (p.quests[k]) STATE.quests[k] = { ...DEFAULT_STATE.quests[k], ...p.quests[k] };
            STATE.maxHp = 100 + STATE.upgrades.hp * 25;
        }
    } catch(e) { console.warn('Load error:', e); }
}

function saveGame(silent) {
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(STATE));
        if (tg && tg.CloudStorage && typeof tg.CloudStorage.setItem === 'function') {
            try { tg.CloudStorage.setItem('cosmicV9', JSON.stringify(STATE), () => {}); } catch(e) {}

            clearTimeout(saveGame._t);
            saveGame._t = setTimeout(() => el.classList.remove('show'), 400);
        }
    } catch(e) {}
}

const MAX_DPR = Math.min(window.devicePixelRatio || 1, 2);
const sprites = {};

function generateSpriteDataURL(drawFn, w, h) {
    const c = document.createElement('canvas');
    c.width = w * MAX_DPR; c.height = h * MAX_DPR;
    const cx = c.getContext('2d');
    cx.scale(MAX_DPR, MAX_DPR);
    drawFn(cx, w, h);
    return c.toDataURL();
}

function loadImageFromDataURL(dataUrl) {
    return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => resolve(img);
        img.src = dataUrl;
    });
}

async function createSprite(key, drawFn, w, h) {
    const cachedDataUrl = await loadSpriteFromDB(key);
    
    if (cachedDataUrl) {
        const img = await loadImageFromDataURL(cachedDataUrl);
        sprites[key] = img;
    } else {
        const dataUrl = generateSpriteDataURL(drawFn, w, h);
        saveSpriteToDB(key, dataUrl);
        const img = await loadImageFromDataURL(dataUrl);
        sprites[key] = img;
    }
}

function useAbility(slot) {
    if (!STATE.isPlaying || STATE.isPaused) return;
    const abilityId = STATE.equippedAbilities[slot];
    if (!abilityId || abilityCooldowns[slot] > 0) return;
    const ability = ABILITIES[abilityId];
    if (!ability) return;
    if (abilityId === 'rocketStrike' && enemies.length === 0 && !boss) return;
    abilityCooldowns[slot] = ability.cooldown;
    const btn = $('ability-slot-' + slot);
    if (btn) { btn.classList.add('firing'); setTimeout(() => btn.classList.remove('firing'), 300); }
    haptic('medium');
    switch(abilityId) {
        case 'rocketStrike': castRocket(); break;
        case 'laserBeam':    castLaserBeam(); break;
        case 'nova':         castNova(); break;
        case 'freeze':       castFreeze(); break;
        case 'acid':         castAcid(); break;
    }
}

function castRocket() {
    const targets = [...enemies];
    if (boss) targets.push(boss);
    if (targets.length === 0) return;
    const shots = [];
    for (let i = 0; i < 2; i++) {
        if (targets.length === 0) break;
        const idx = Math.floor(Math.random() * targets.length);
        shots.push(targets.splice(idx, 1)[0]);
    }
    for (const t of shots) {
        missiles.push({ x: player.x, y: player.y - 20, target: t, vx: 0, vy: -12, life: 90, trail: [], color: '#ff8800' });
    }
    screenFlash = 0.3; screenFlashColor = '#ff8800';
    screenShake = Math.max(screenShake, 8);
}
function castLaserBeam() {
    beams.push({ x: player.x, y: player.y - 22, life: 20, maxLife: 20, width: 40, color: '#00ffff' });
    for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        if (Math.abs(e.x - player.x) < 40 && e.y < player.y) damageEnemy(e, 15, i);
    }
    if (boss && Math.abs(boss.x - player.x) < 60 && boss.y < player.y) {
        boss.hp -= 15; boss.hitFlash = 4; updateBossBar();
        if (boss.hp <= 0) defeatBoss();
    }
    screenFlash = 0.4; screenFlashColor = '#00ffff';
    screenShake = Math.max(screenShake, 12);
}
function castNova() {
    shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 400, life: 30, maxLife: 30, color: '#ffaa00' });
    for (let i = enemies.length - 1; i >= 0; i--) damageEnemy(enemies[i], 9999, i);
    if (boss) { boss.hp -= 100; boss.hitFlash = 6; updateBossBar(); if (boss.hp <= 0) defeatBoss(); }
    screenFlash = 0.7; screenFlashColor = '#ffaa00';
    screenShake = Math.max(screenShake, 20);
}
function castFreeze() {
    freezeTimer = 300;
    shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 600, life: 30, maxLife: 30, color: '#88ddff' });
    screenFlash = 0.5; screenFlashColor = '#88ddff';
}
function castAcid() {
    acidTimer = 120; // 2 seconds
    shockwaves.push({ x: player.x, y: player.y, radius: 10, maxRadius: 800, life: 30, maxLife: 30, color: '#00ff00' });
    screenFlash = 0.5; screenFlashColor = '#00ff00';
}

function damageEnemy(e, dmg, idx) {
    e.hp -= dmg; e.hitFlash = 4;
    if (e.hp <= 0) {
        createExplosion(e.x, e.y, e.color, 16, 5);
        enemies.splice(idx, 1);
        STATE.totalKills++;
        const baseCoin = (ENEMY_TYPES[e.type] && ENEMY_TYPES[e.type].coin) || 0.5;
        const reward = baseCoin * getCoinMult() * STATE.multiplier;
        STATE.coins += reward;
        damageNumbers.push({ x: e.x, y: e.y, value: '+' + Math.floor(reward * 10), life: 50, color: '#ffd700', isCoin: true });
        updateUI();
        checkQuestProgress();
    }
}

function pauseGameForModal() {
    if (STATE.isPlaying) {
        STATE.isPaused = true;
    }
}
function resumeGameFromModal() {
    if (STATE.isPlaying) {
        STATE.isPaused = false;
        lastFrameTime = performance.now();
    }
}

function startGame() {
    try {
        if (window._stopMenuAnim) window._stopMenuAnim();
        $('main-menu').classList.remove('show');
        canvas.classList.add('show');
        $('ui-top').classList.add('show');
        $('side-controls').classList.add('show');
        $('ability-panel').classList.add('show');
        $('fps-counter').classList.add('show');
        STATE.isPlaying = true; STATE.isPaused = false;
        STATE.maxHp = 100 + STATE.upgrades.hp * 25;
        STATE.hp = STATE.maxHp;
        resize();
        player.x = W/2; player.y = H - 180; touchX = W/2; touchY = H - 180;
        player.invuln = 60;
        player.weaponCooldowns = [0,0,0,0,0];
        bullets = []; enemies = []; enemyBullets = []; particles = []; boss = null;
        missiles = []; beams = []; shockwaves = []; damageNumbers = [];
        abilityCooldowns = [0, 0]; freezeTimer = 0; acidTimer = 0;
        waveCompleting = false;
        updateUI(); updateAbilityUI(); startWave();
        lastFrameTime = performance.now();
        fpsUpdateTimer = 0; frameCount = 0;
        requestAnimationFrame(loop);
    } catch(e) { console.error('startGame error:', e); }
}

function goToMenu() {
    STATE.isPlaying = false; STATE.isPaused = false;
    saveGame(true);
    canvas.classList.remove('show');
    $('ui-top').classList.remove('show');
    $('side-controls').classList.remove('show');
    $('ability-panel').classList.remove('show');
    $('fps-counter').classList.remove('show');
    $('boss-bar-container').classList.remove('show');
    hide('pause-screen');
    hide('game-over-screen');
    showMenu();
    if (!menuAnim) initMenuAnimation();
}

function getDamageMult() { return 1 + (STATE.upgrades.damage * UPGRADES.damage.val); }
function getFireRate() { return Math.max(3, WEAPONS[STATE.weapon].rate * Math.pow(UPGRADES.fireRate.val, STATE.upgrades.fireRate)); }
function getPlayerSpeed() { return 0.18 + (STATE.upgrades.speed * UPGRADES.speed.val); }
function getCoinMult() { return 1 + (STATE.upgrades.magnet * UPGRADES.magnet.val); }

function getWaveEnemyMix() {
    const w = STATE.wave;
    const mix = [{ type:'drone', weight: Math.max(0.2, 1 - w*0.04) }];
    if (w >= 4) mix.push({ type:'monster', weight: Math.min(0.6, 0.15 + w*0.03) });
    if (w >= 8) mix.push({ type:'shooter', weight: Math.min(0.4, 0.1 + (w-8)*0.04) });
    if (w >= 15) mix.push({ type:'tank', weight: Math.min(0.35, 0.1 + (w-15)*0.03) });
    return mix;
}
function pickEnemyType() {
    const mix = getWaveEnemyMix();
    const total = mix.reduce((s,m)=>s+m.weight, 0);
    let r = Math.random() * total;
    for (const m of mix) { r -= m.weight; if (r <= 0) return m.type; }
    return 'drone';
}
function getEnemyPowerMult() { return 1 + Math.pow(STATE.wave / 10, 1.4) * 1.5; }

function startWave() {
    STATE.maxHp = 100 + STATE.upgrades.hp * 25;
    STATE.hp = STATE.maxHp;
    waveCompleting = false;
    waveConfig.timer = 0; waveConfig.spawned = 0;
    if (STATE.wave % 5 === 0) {
        waveConfig.total = 0; waveConfig.active = false;
        spawnBoss();
        showWaveBanner('⚠ БОСС ⚠');
    } else {
        waveConfig.total = 8 + STATE.wave * 2;
        waveConfig.active = true;
        showWaveBanner('ВОЛНА ' + STATE.wave);
    }
    updateUI();
    checkQuestProgress();
}
function showWaveBanner(t) { waveBanner.text = t; waveBanner.alpha = 1; waveBanner.timer = 120; }

function spawnEnemy() {
    const cols = 6, row = Math.floor(waveConfig.spawned / cols), col = waveConfig.spawned % cols;
    const spacingX = W / (cols + 1);
    const type = pickEnemyType();
    const t = ENEMY_TYPES[type];
    const hp = Math.floor((t.hpBase + STATE.wave * 0.6) * getEnemyPowerMult());
    const vy = t.vyBase + STATE.wave * 0.03;
    enemies.push({
        x: spacingX * (col + 1), y: -60 - (row * 60),
        w: t.w, h: t.h, hp: hp, maxHp: hp, vy: vy,
        time: Math.random() * 100, type: type, sprite: t.sprite, color: t.color,
        dmg: Math.floor(t.dmg * (1 + STATE.wave * 0.02)),
        shootTimer: t.shoots ? 60 + Math.random() * 60 : 0,
        hitFlash: 0
    });
    waveConfig.spawned++;
}

function spawnBoss() {
    const bossLevel = Math.floor(STATE.wave / 5);
    const hp = Math.floor(400 * bossLevel * getEnemyPowerMult() * 0.6);
    boss = { x: W/2, y: -180, targetY: 140, w: 160, h: 160, hp: hp, maxHp: hp, time: 0, level: bossLevel, shootTimer: 120, hitFlash: 0, phase: 1 };
    $('boss-bar-container').classList.add('show');
}

function shoot() {
    const offsets = [
        { x: -42, y: 0 },   // 0: левое крыло
        { x:  42, y: 0 },   // 1: правое крыло
        { x:   0, y: -25 }, // 2: центр
        { x: -25, y: -15 }, // 3: верх-лев
        { x:  25, y: -15 }  // 4: верх-прав
    ];
    for (let slot = 0; slot < STATE.weaponSlots.length; slot++) {
        if (!STATE.slotUnlocked[slot]) continue;
        const wid = STATE.weaponSlots[slot];
        if (!wid) continue;
        if (player.weaponCooldowns[slot] > 0) { player.weaponCooldowns[slot]--; continue; }
        const w = WEAPONS[wid];
        if (!w) continue;
        const off = offsets[slot] || {x:0, y:0};
        const dmgMult = getDamageMult();
        for (let i = 0; i < w.count; i++) {
            let angle = -Math.PI/2;
            if (w.count > 1) angle += (i - (w.count-1)/2) * ((w.spread * Math.PI / 180) / (w.count-1 || 1));
            const b = getBullet();
            b.x = player.x + off.x; b.y = player.y + off.y - 10;
            b.vx = Math.cos(angle) * 17; b.vy = Math.sin(angle) * 17;
            b.dmg = w.dmg * dmgMult; b.color = w.color; b.r = w.homing ? 7 : 5;
            b.homing = !!w.homing; b.target = null;
            bullets.push(b);
        }
        player.weaponCooldowns[slot] = Math.max(3, w.rate * Math.pow(UPGRADES.fireRate.val, STATE.upgrades.fireRate));
    }
}

function enemyShoot(e) {
    const dx = player.x - e.x, dy = player.y - e.y;
    const dist = Math.hypot(dx, dy); if (dist < 1) return;
    enemyBullets.push({ x: e.x, y: e.y, vx: (dx/dist)*4, vy: (dy/dist)*4, dmg: 8 + STATE.wave * 0.3, r: 6, color: '#ff00ff' });
}
function bossShoot() {
    if (!boss) return;
    const count = 5 + boss.level;
    for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 / count) * i + boss.time * 0.5;
        enemyBullets.push({ x: boss.x, y: boss.y, vx: Math.cos(angle) * 4.5, vy: Math.sin(angle) * 4.5, dmg: 10 + STATE.wave * 0.3, r: 8, color: '#ff0055' });
    }
}
function createExplosion(x, y, color, count=8, size=4) {
    for(let i=0; i<count; i++) {
        const a = Math.random()*Math.PI*2, s = Math.random()*5+2;
        const p = getParticle(); p.x = x; p.y = y;
        p.vx = Math.cos(a)*s; p.vy = Math.sin(a)*s;
        p.life = 1; p.color = color; p.size = Math.random()*size+1;
        particles.push(p);
    }
    screenShake = Math.max(screenShake, 6);
}
function takeDamage(amt) {
    if (player.invuln > 0) return;
    STATE.hp -= amt; screenShake = 12; player.invuln = 30;
    if (STATE.hp <= 0) gameOver();
}
function gameOver() {
    STATE.isPlaying = false;
    saveGame(true);
    show('game-over-screen');
}
function restartWave() {
    hide('game-over-screen');
    hide('pause-screen');
    STATE.isPlaying = true; STATE.isPaused = false;
    STATE.maxHp = 100 + STATE.upgrades.hp * 25; STATE.hp = STATE.maxHp;
    enemies = []; bullets = []; enemyBullets = []; boss = null; particles = [];
    missiles = []; beams = []; shockwaves = []; damageNumbers = [];
    $('boss-bar-container').classList.remove('show');
    player.invuln = 90;
    player.weaponCooldowns = [0,0,0,0,0];
    waveCompleting = false;
    abilityCooldowns = [0, 0];
    startWave();
    lastFrameTime = performance.now();
    requestAnimationFrame(loop);
}
function togglePause() {
    if (!STATE.isPlaying) return;
    STATE.isPaused = !STATE.isPaused;
    if (STATE.isPaused) show('pause-screen');
    else hide('pause-screen');
    haptic('medium');
}

function completeWave() {
    if (waveCompleting) return;
    waveCompleting = true;
    waveConfig.active = false;
    waveConfig.spawned = 0; waveConfig.total = 0; waveConfig.timer = 0;
    STATE.coins += 1.0 * getCoinMult() * STATE.multiplier;
    STATE.wave++;
    STATE.multiplier += 0.1;
    if ((STATE.wave - 1) % 5 === 0) STATE.multiplier += 1.0;
    saveGame(true); updateUI(); checkQuestProgress();
    setTimeout(() => { waveCompleting = false; if (STATE.isPlaying) startWave(); }, 1500);
}

function defeatBoss() {
    if (!boss) return;
    createExplosion(boss.x, boss.y, '#ffaa00', 60, 8);
    screenShake = 25; screenFlash = 0.6; screenFlashColor = '#ffaa00';
    boss = null;
    STATE.bossDefeated = (STATE.bossDefeated || 0) + 1;
    $('boss-bar-container').classList.remove('show');
    
    // NEW BOSS REWARD LOGIC
    const allWeaponsUnlocked = Object.keys(WEAPONS).every(id => STATE.unlockedWeapons.includes(id));
    let reward = 5.0 * getCoinMult() * STATE.multiplier;
    if (allWeaponsUnlocked) {
        // 1st boss (index 0) = 250, 2nd = 500, 3rd = 1000...
        // bossDefeated is now incremented, so current count is STATE.bossDefeated
        // Formula: 250 * 2^(count-1)
        const count = STATE.bossDefeated; 
        reward = 250 * Math.pow(2, count - 1);
    }
    
    STATE.coins += reward;
    saveGame(true); updateUI(); checkQuestProgress();
    openCase(true);
    const wait = setInterval(() => {
        if (!STATE.isPaused) { clearInterval(wait); completeWave(); }
    }, 200);
    setTimeout(() => { clearInterval(wait); if (STATE.isPlaying && !waveCompleting) completeWave(); }, 15000);
}

// ============================================================
// === UPDATE ===
// ============================================================
function update(dt) {
    if (!STATE.isPlaying || STATE.isPaused) return;
    if (player.invuln > 0) player.invuln--;
    for (let i = 0; i < 2; i++) if (abilityCooldowns[i] > 0) abilityCooldowns[i]--;
    updateAbilityUI();
    if (STATE.autoUse) for (let i = 0; i < 2; i++) if (STATE.equippedAbilities[i] && abilityCooldowns[i] === 0) useAbility(i);
    if (freezeTimer > 0) freezeTimer--;
    
    // ACID LOGIC
    if (acidTimer > 0) {
        acidTimer--;
        // Every 60 frames (1 sec) deal damage
        if (acidTimer % 60 === 0) {
            for (let i = enemies.length - 1; i >= 0; i--) {
                const e = enemies[i];
                const dmg = e.maxHp * 0.25;
                damageEnemy(e, dmg, i);
            }
            if (boss) {
                const dmg = boss.maxHp * 0.25;
                boss.hp -= dmg; boss.hitFlash = 4; updateBossBar();
                if (boss.hp <= 0) defeatBoss();
            }
        }
    }

    player.x += (touchX - player.x) * getPlayerSpeed();
    player.y += (touchY - player.y) * getPlayerSpeed();
    player.x = Math.max(50, Math.min(W-50, player.x));
    player.y = Math.max(60, Math.min(H-60, player.y));

    shoot();
    if (waveConfig.active && waveConfig.spawned < waveConfig.total && ++waveConfig.timer > 22) { spawnEnemy(); waveConfig.timer = 0; }

    for (let i = missiles.length - 1; i >= 0; i--) {
        const m = missiles[i];
        m.trail.unshift({x:m.x, y:m.y}); if (m.trail.length > 8) m.trail.pop();
        
        let targetAlive = m.target && m.target.hp > 0;
        
        if (targetAlive) {
            const dx = m.target.x - m.x;
            const dy = m.target.y - m.y;
            const dist = Math.hypot(dx, dy);
            
            if (dist < 30) {
                const dmg = m.target.hp;
                if (m.target === boss) { 
                    boss.hp -= dmg; boss.hitFlash = 6; updateBossBar(); 
                    if (boss.hp <= 0) defeatBoss(); 
                } else {
                    const idx = enemies.indexOf(m.target);
                    if (idx >= 0) { 
                        damageNumbers.push({ x: m.target.x, y: m.target.y, value: Math.floor(dmg), life: 60, color: '#ff8800' }); 
                        damageEnemy(m.target, dmg, idx); 
                    }
                }
                createExplosion(m.x, m.y, '#ff8800', 20, 6);
                missiles.splice(i, 1);
                screenShake = Math.max(screenShake, 10);
                continue;
            }

            if (dist > 1) {
                m.vx += (dx/dist) * 2.5; 
                m.vy += (dy/dist) * 2.5;
                const mag = Math.hypot(m.vx, m.vy);
                if (mag > 14) { m.vx = (m.vx/mag)*14; m.vy = (m.vy/mag)*14; }
            }
        } else {
            m.vy -= 0.5; 
        }

        m.x += m.vx; m.y += m.vy; m.life--;
        
        if (Math.random() < 0.7) {
            const p = getParticle();
            p.x = m.x + (Math.random()-0.5)*6; p.y = m.y + (Math.random()-0.5)*6;
            p.vx = (Math.random()-0.5)*1.5; p.vy = (Math.random()-0.5)*1.5;
            p.life = 0.6; p.color = '#ff8800'; p.size = Math.random()*3+1;
            particles.push(p);
        }

        if (m.life <= 0 || m.y < -50 || m.y > H + 50 || m.x < -50 || m.x > W + 50) missiles.splice(i, 1);
    }

    for (let i = beams.length - 1; i >= 0; i--) { beams[i].life--; if (beams[i].life <= 0) beams.splice(i, 1); }
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i]; sw.life--; sw.radius = sw.maxRadius * (1 - sw.life / sw.maxLife);
        if (sw.life <= 0) shockwaves.splice(i, 1);
    }
    for (let i = damageNumbers.length - 1; i >= 0; i--) {
        const dn = damageNumbers[i]; dn.y -= 1.5; dn.life--;
        if (dn.life <= 0) damageNumbers.splice(i, 1);
    }

    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.trail.unshift({x:b.x, y:b.y}); if (b.trail.length > 4) b.trail.pop();
        if (b.homing) {
            if (!b.target || b.target.hp <= 0) {
                let nearest = null, nd = 9999;
                for (const e of enemies) { const d = Math.hypot(e.x - b.x, e.y - b.y); if (d < nd) { nd = d; nearest = e; } }
                if (boss && !nearest) nearest = boss;
                b.target = nearest;
            }
            if (b.target) {
                const dx = b.target.x - b.x, dy = b.target.y - b.y, dist = Math.hypot(dx, dy);
                if (dist > 1) {
                    const speed = 15;
                    b.vx += (dx/dist) * 1.2; b.vy += (dy/dist) * 1.2;
                    const mag = Math.hypot(b.vx, b.vy);
                    if (mag > speed) { b.vx = (b.vx/mag)*speed; b.vy = (b.vy/mag)*speed; }
                }
            }
        }
        b.x += b.vx; b.y += b.vy;
        if (b.y < -20 || b.x < -20 || b.x > W+20 || b.y > H+20) { bullets.splice(i, 1); releaseBullet(b); continue; }
        if (boss && Math.abs(b.x - boss.x) < boss.w/2 && Math.abs(b.y - boss.y) < boss.h/2) {
            boss.hp -= b.dmg; boss.hitFlash = 4; bullets.splice(i, 1); releaseBullet(b); updateBossBar();
            if (boss.hp <= 0) defeatBoss();
            continue;
        }
        let hit = false;
        for (let j = enemies.length - 1; j >= 0; j--) {
            let e = enemies[j];
            if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - e.y) < e.h/2) {
                e.hp -= b.dmg; e.hitFlash = 3; hit = true;
                if (e.hp <= 0) damageEnemy(e, 0, j);
                break;
            }
        }
        if (hit) { bullets.splice(i, 1); releaseBullet(b); }
    }

    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        const sp = freezeTimer > 0 ? 0.3 : 1;
        e.y += e.vy * sp; e.time += 0.05 * sp;
        e.x += Math.sin(e.time) * (e.type === 'monster' ? 2.5 : e.type === 'tank' ? 0.8 : 1.2);
        if (e.hitFlash > 0) e.hitFlash--;
        if (e.shootTimer > 0) e.shootTimer -= sp;
        else if (ENEMY_TYPES[e.type].shoots) { enemyShoot(e); e.shootTimer = 90 + Math.random()*60; }
        if (Math.abs(e.x - player.x) < (e.w/2 + 20) && Math.abs(e.y - player.y) < (e.h/2 + 20)) {
            takeDamage(e.dmg); createExplosion(e.x, e.y, e.color, 10, 4); enemies.splice(i, 1); continue;
        }
        if (e.y > H + 80) enemies.splice(i, 1);
    }
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
        const eb = enemyBullets[i];
        eb.x += eb.vx; eb.y += eb.vy;
        if (eb.x < -30 || eb.x > W+30 || eb.y < -30 || eb.y > H+30) { enemyBullets.splice(i, 1); continue; }
        if (Math.abs(eb.x - player.x) < 20 && Math.abs(eb.y - player.y) < 20) { takeDamage(eb.dmg); enemyBullets.splice(i, 1); }
    }
    if (boss) {
        if (boss.y < boss.targetY) boss.y += 2.5;
        boss.time += 0.02;
        boss.x = W/2 + Math.sin(boss.time) * (W/3);
        if (boss.hitFlash > 0) boss.hitFlash--;
        const hpPct = boss.hp / boss.maxHp;
        boss.phase = hpPct > 0.66 ? 1 : hpPct > 0.33 ? 2 : 3;
        if (boss.y >= boss.targetY) {
            if (boss.shootTimer > 0) boss.shootTimer--;
            else { bossShoot(); boss.shootTimer = Math.max(40, 120 - boss.phase * 20); }
        }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vx *= 0.96; p.vy *= 0.96; p.life -= 0.04;
        if (p.life <= 0) { particles.splice(i, 1); releaseParticle(p); }
    }
    for (const s of stars) {
        s.y += s.speed * (1 + s.layer * 0.5); s.twinkle += 0.05;
        if (s.y > H) { s.y = 0; s.x = Math.random()*W; }
    }
    if (!boss && waveConfig.active && !waveCompleting && waveConfig.spawned >= waveConfig.total && waveConfig.total > 0 && enemies.length === 0) completeWave();
    if (screenShake > 0) screenShake *= 0.88;
    if (screenShake < 0.5) screenShake = 0;
    if (screenFlash > 0) screenFlash *= 0.9;
    if (waveBanner.timer > 0) { waveBanner.timer--; waveBanner.alpha = Math.min(1, waveBanner.timer / 40); }
}

// ============================================================
// === DRAW ===
// ============================================================
function draw() {
    const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, '#030308'); bgGrad.addColorStop(0.5, '#0a0518'); bgGrad.addColorStop(1, '#030308');
    ctx.fillStyle = bgGrad; ctx.fillRect(0, 0, W, H);
    ctx.save();
    if (screenShake > 0) ctx.translate((Math.random()-0.5)*screenShake, (Math.random()-0.5)*screenShake);
    for (const s of stars) {
        const a = 0.4 + Math.sin(s.twinkle) * 0.3;
        ctx.globalAlpha = a;
        ctx.fillStyle = s.layer === 0 ? '#aaf' : s.layer === 1 ? '#fff' : '#faf';
        ctx.beginPath(); ctx.arc(s.x, s.y, s.s, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (freezeTimer > 0) { ctx.fillStyle = 'rgba(100, 200, 255, 0.08)'; ctx.fillRect(0, 0, W, H); }
    if (acidTimer > 0) { ctx.fillStyle = 'rgba(0, 255, 0, 0.08)'; ctx.fillRect(0, 0, W, H); }

    for (const sw of shockwaves) {
        const a = sw.life / sw.maxLife;
        ctx.globalAlpha = a * 0.6; ctx.strokeStyle = sw.color; ctx.lineWidth = 8 * a;
        ctx.shadowBlur = 30; ctx.shadowColor = sw.color;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius, 0, 7); ctx.stroke();
        ctx.globalAlpha = a * 0.3;
        ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.radius * 0.7, 0, 7); ctx.stroke();
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    for (const p of particles) {
        ctx.globalAlpha = p.life; ctx.shadowBlur = 14; ctx.shadowColor = p.color;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * p.life, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;

    for (const b of beams) {
        const a = b.life / b.maxLife;
        ctx.globalAlpha = a;
        const grad = ctx.createLinearGradient(b.x, b.y, b.x, 0);
        grad.addColorStop(0, b.color); grad.addColorStop(1, 'rgba(0,255,255,0)');
        ctx.fillStyle = grad; ctx.shadowBlur = 40; ctx.shadowColor = b.color;
        const width = b.width * a;
        ctx.fillRect(b.x - width/2, 0, width, b.y);
        ctx.fillStyle = 'rgba(255,255,255,' + (a * 0.8) + ')';
        ctx.fillRect(b.x - width/6, 0, width/3, b.y);
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    const blink = player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0;
    if (!blink && sprites.player) ctx.drawImage(sprites.player, player.x - 55, player.y - 55, 110, 110);

    const hpBarW = 70, hpBarH = 6, hpBarY = player.y - 70;
    const hpPct = Math.max(0, STATE.hp / STATE.maxHp);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(player.x - hpBarW/2 - 1, hpBarY - 1, hpBarW + 2, hpBarH + 2);
    ctx.fillStyle = hpPct > 0.5 ? '#00ff88' : hpPct > 0.25 ? '#ffaa00' : '#ff0055';
    ctx.shadowBlur = 10; ctx.shadowColor = ctx.fillStyle;
    ctx.fillRect(player.x - hpBarW/2, hpBarY, hpBarW * hpPct, hpBarH);
    ctx.shadowBlur = 0;
    ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.lineWidth = 1;
    ctx.strokeRect(player.x - hpBarW/2, hpBarY, hpBarW, hpBarH);

    for (const b of bullets) {
        for (let i = b.trail.length - 1; i >= 0; i--) {
            const t = b.trail[i]; const a = (1 - i / b.trail.length) * 0.4;
            ctx.globalAlpha = a; ctx.fillStyle = b.color;
            ctx.beginPath(); ctx.arc(t.x, t.y, b.r * (1 - i*0.15), 0, 7); ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 18; ctx.shadowColor = b.color;
        const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r*2);
        g.addColorStop(0, '#fff'); g.addColorStop(0.5, b.color); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 1.5, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const m of missiles) {
        for (let i = m.trail.length - 1; i >= 0; i--) {
            const t = m.trail[i]; const a = (1 - i / m.trail.length) * 0.7;
            ctx.globalAlpha = a; ctx.fillStyle = '#ff8800';
            ctx.shadowBlur = 15; ctx.shadowColor = '#ff8800';
            ctx.beginPath(); ctx.arc(t.x, t.y, 6 * (1 - i*0.1), 0, 7); ctx.fill();
        }
        ctx.globalAlpha = 1; ctx.shadowBlur = 25; ctx.shadowColor = '#ff8800';
        const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 12);
        g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffcc00'); g.addColorStop(1, '#ff4400');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(m.x, m.y, 8, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const eb of enemyBullets) {
        ctx.shadowBlur = 15; ctx.shadowColor = eb.color;
        const g = ctx.createRadialGradient(eb.x, eb.y, 0, eb.x, eb.y, eb.r*2);
        g.addColorStop(0, '#fff'); g.addColorStop(0.4, eb.color); g.addColorStop(1, 'rgba(255,0,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, 7); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const e of enemies) {
        const sprite = sprites[e.sprite];
        const size = e.sprite === 'tank' ? 90 : e.sprite === 'monster' ? 70 : e.sprite === 'shooter' ? 60 : 50;
        if (sprite) {
            if (freezeTimer > 0) {
                ctx.globalAlpha = 0.6;
                ctx.drawImage(sprite, e.x - size/2, e.y - size/2, size, size);
                ctx.globalAlpha = 0.5; ctx.fillStyle = '#88ddff';
                ctx.beginPath(); ctx.arc(e.x, e.y, size/2, 0, 7); ctx.fill();
                ctx.globalAlpha = 1;
            } else if (acidTimer > 0) {
                ctx.globalAlpha = 0.8;
                ctx.drawImage(sprite, e.x - size/2, e.y - size/2, size, size);
                ctx.globalAlpha = 0.4; ctx.fillStyle = '#00ff00';
                ctx.beginPath(); ctx.arc(e.x, e.y, size/2, 0, 7); ctx.fill();
                ctx.globalAlpha = 1;
            } else {
                ctx.drawImage(sprite, e.x - size/2, e.y - size/2, size, size);
            }
        }
        if (e.hitFlash > 0) {
            ctx.globalAlpha = e.hitFlash / 3 * 0.6; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(e.x, e.y, e.w/2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        }
        const pct = e.hp / e.maxHp;
        ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 10, e.w, 4);
        ctx.fillStyle = pct > 0.5 ? '#0f0' : pct > 0.25 ? '#ffaa00' : '#f00';
        ctx.fillRect(e.x - e.w/2, e.y - e.h/2 - 10, e.w * pct, 4);
    }

    if (boss && sprites.boss) {
        ctx.drawImage(sprites.boss, boss.x - 90, boss.y - 90, 180, 180);
        if (boss.hitFlash > 0) {
            ctx.globalAlpha = boss.hitFlash / 4 * 0.5; ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(boss.x, boss.y, boss.w/2, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
        }
    }

    for (const dn of damageNumbers) {
        const a = dn.life / 60;
        ctx.globalAlpha = a; ctx.font = 'bold 20px Orbitron, sans-serif'; ctx.textAlign = 'center';
        ctx.fillStyle = dn.color; ctx.shadowBlur = 15; ctx.shadowColor = dn.color;
        ctx.fillText((dn.isCoin ? '' : '-') + dn.value, dn.x, dn.y);
        ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;

    if (waveBanner.timer > 0) {
        ctx.globalAlpha = waveBanner.alpha;
        ctx.font = 'bold min(42px, 10vw) Orbitron, sans-serif'; ctx.textAlign = 'center';
        ctx.shadowBlur = 25; ctx.shadowColor = '#0ff'; ctx.fillStyle = '#fff';
        ctx.fillText(waveBanner.text, W/2, H/2 - 60);
        ctx.shadowBlur = 0; ctx.globalAlpha = 1;
    }
    ctx.restore();

    if (screenFlash > 0.01) {
        ctx.fillStyle = screenFlashColor; ctx.globalAlpha = screenFlash * 0.5;
        ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
    }
}

// === LOOP (FPS UPDATED) ===
// ============================================================
function loop(timestamp) {
    if (!STATE.isPlaying) return;
    requestAnimationFrame(loop);
    if (document.hidden || STATE.isPaused) {
        lastFrameTime = timestamp;
        return;
    }
    const delta = timestamp - lastFrameTime;
    if (delta < FRAME_TIME - 1) return;
    lastFrameTime = timestamp - (delta % FRAME_TIME);

    frameCount++;
    fpsUpdateTimer += delta;
    
    // Update FPS every 200ms for smoother reading but still accurate
    if (fpsUpdateTimer >= 200) {
        const fps = Math.round(frameCount * 1000 / fpsUpdateTimer);
        fpsEl.textContent = `FPS: ${fps}`;
        frameCount = 0;
        fpsUpdateTimer = 0;
    }

    update(delta);
    draw();
}

        if (k === 'hp') { STATE.maxHp = 100 + STATE.upgrades.hp * 25; STATE.hp = STATE.maxHp; }

    }
}

function drawShipBuilder() {
    const cv = $('builder-canvas');
    if (!cv) return;
    const rect = cv.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = rect.width * dpr; cv.height = rect.height * dpr;
    const bx = cv.getContext('2d');
    bx.setTransform(dpr, 0, 0, dpr, 0, 0);
    bx.clearRect(0, 0, rect.width, rect.height);
    bx.fillStyle = '#0a0a1a';
    bx.fillRect(0, 0, rect.width, rect.height);

    const scale = Math.min(rect.width / 220, rect.height / 220);
    bx.translate(rect.width / 2, rect.height / 2);
    bx.scale(scale, scale);

    if (sprites.player) bx.drawImage(sprites.player, -55, -55, 110, 110);

    const offsets = [
        { x: -42, y: 0 }, { x: 42, y: 0 }, { x: 0, y: -25 }, { x: -25, y: -15 }, { x: 25, y: -15 }
    ];
    for (let i = 0; i < STATE.weaponSlots.length; i++) {
        const off = offsets[i];
        const wid = STATE.weaponSlots[i];
        const unlockedSlot = STATE.slotUnlocked[i];
        bx.save();
        bx.translate(off.x, off.y);
        if (!unlockedSlot) {
            bx.strokeStyle = '#ffd700'; bx.lineWidth = 1.5;
            bx.setLineDash([3, 3]);
        } else if (i === selectedBuilderSlot) {
            bx.strokeStyle = '#fff'; bx.lineWidth = 2;
            bx.shadowBlur = 15; bx.shadowColor = '#fff';
        } else {
            bx.strokeStyle = 'rgba(0,255,255,0.5)'; bx.lineWidth = 1.5;
            bx.shadowBlur = 8; bx.shadowColor = '#0ff';
        }
        bx.beginPath(); bx.arc(0, 0, 12, 0, 7); bx.stroke();
        bx.setLineDash([]);
        bx.shadowBlur = 0;
        if (wid) {
            const w = WEAPONS[wid];
            bx.fillStyle = w.color;
            bx.shadowBlur = 10; bx.shadowColor = w.color;
            bx.font = 'bold 14px "Font Awesome 6 Free"';
            bx.textAlign = 'center'; bx.textBaseline = 'middle';
            const iconCode = { 'fa-gun':'\uf6e4', 'fa-bolt':'\uf0e7', 'fa-atom':'\uf5d2', 'fa-fire':'\uf06d', 'fa-bolt-lightning':'\ue0b7', 'fa-rocket':'\uf135', 'fa-fan':'\uf863', 'fa-crosshairs':'\uf05b' }[w.icon] || '?';
            bx.fillText(iconCode, 0, 0);
            bx.shadowBlur = 0;
        } else if (!unlockedSlot) {
            bx.fillStyle = '#ffd700';
            bx.font = 'bold 12px "Font Awesome 6 Free"';
            bx.textAlign = 'center'; bx.textBaseline = 'middle';
            bx.fillText('\uf023', 0, 0);
        }
        bx.restore();
    }
}

function renderBuilderSlots() {
    const wrap = $('builder-slots');
    if (!wrap) return;
    wrap.innerHTML = '';
    const SLOT_NAMES = ['Лев. крыло', 'Прав. крыло', 'Центр', 'Верх-лев', 'Верх-прав'];
    for (let i = 0; i < STATE.weaponSlots.length; i++) {
        const wid = STATE.weaponSlots[i];
        const unlocked = STATE.slotUnlocked[i];
        const cost = SLOT_COSTS[i];
        
        const el = document.createElement('div');
        let classes = 'builder-slot';
        if (wid) classes += ' filled';
        if (i === selectedBuilderSlot) classes += ' active';
        if (!unlocked) classes += ' locked';
        
        el.className = classes;
        el.title = SLOT_NAMES[i];
        
        if (!unlocked) {
            el.innerHTML = `<i class="fa-solid fa-lock"></i>`;
            el.onclick = () => {
                if (STATE.coins >= cost) {
                    STATE.coins -= cost;
                    STATE.slotUnlocked[i] = true;
                    saveGame(); updateUI(); 
                    drawShipBuilder(); renderBuilderSlots();
                    haptic('success');
                } else {
                    haptic('error');
                }
            };
        } else {
            el.innerHTML = wid ? `<i class="fa-solid ${WEAPONS[wid].icon}" style="color:${WEAPONS[wid].color}"></i>` : `<i class="fa-solid fa-plus"></i>`;
            el.onclick = () => {
                selectedBuilderSlot = i;
                drawShipBuilder();
                renderBuilderSlots();
            };
        }
        wrap.appendChild(el);
    }
    renderWeaponPicker();
}

function renderWeaponPicker() {
    const wrap = $('weapon-pick-list');
    if (!wrap) return;
    wrap.innerHTML = '';
    
    if (!STATE.slotUnlocked[selectedBuilderSlot]) {
        const cost = SLOT_COSTS[selectedBuilderSlot];
        wrap.innerHTML = `<div style="color:#ffd700;font-size:12px;text-align:center;width:100%;padding:10px;border:1px dashed #ffd700;border-radius:8px;">
            <i class="fa-solid fa-lock"></i> СЛОТ ЗАКРЫТ<br>
            <span style="font-size:14px;font-weight:bold;">Цена: ${cost} 💰</span><br>
            <span style="font-size:10px;color:#aaa;">Нажми на замок выше, чтобы купить</span>
        </div>`;
        return;
    }

    const empty = document.createElement('div');
    empty.className = 'weapon-pick' + (!STATE.weaponSlots[selectedBuilderSlot] ? ' selected' : '');
    empty.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    empty.onclick = () => {
        if (selectedBuilderSlot === 2) return;
        STATE.weaponSlots[selectedBuilderSlot] = null;
        saveGame(); drawShipBuilder(); renderBuilderSlots();
    };
    wrap.appendChild(empty);
    for (const id in WEAPONS) {
        const w = WEAPONS[id];
        const unlocked = STATE.unlockedWeapons.includes(id);
        const sel = STATE.weaponSlots[selectedBuilderSlot] === id;
        const el = document.createElement('div');
        el.className = 'weapon-pick' + (unlocked ? '' : ' locked') + (sel ? ' selected' : '');
        el.style.color = w.color;
        el.innerHTML = `<i class="fa-solid ${w.icon}"></i>`;
        if (unlocked) el.onclick = () => {
            STATE.weaponSlots[selectedBuilderSlot] = id;
            saveGame(); drawShipBuilder(); renderBuilderSlots();
        };
        wrap.appendChild(el);
    }
}

// ============================================================
// === QUESTS ===
// ============================================================
function checkQuestProgress() {
    const q = STATE.quests;
    const now = Date.now();
    for (const k in q) {
        if (q[k].claimed && q[k].resetAt && now >= q[k].resetAt) {
            q[k] = { ...q[k], prog: 0, claimed: false, resetAt: 0 };
        }
    }
    if (q.playMinute.prog < STATE.playTime) q.playMinute.prog = Math.min(STATE.playTime, q.playMinute.goal);
    if (q.play5min.prog < STATE.playTime) q.play5min.prog = Math.min(STATE.playTime, q.play5min.goal);
    if (q.play15min.prog < STATE.playTime) q.play15min.prog = Math.min(STATE.playTime, q.play15min.goal);
    q.kill100.prog = Math.min(STATE.totalKills, q.kill100.goal);
    q.kill500.prog = Math.min(STATE.totalKills, q.kill500.goal);
    q.wave10.prog = Math.min(STATE.wave, q.wave10.goal);
    q.bossSlay.prog = Math.min(STATE.bossDefeated || 0, q.bossSlay.goal);
}

function openQuests() {
    if (STATE.isPlaying) pauseGameForModal();
    saveGame(true);
    checkQuestProgress();
    const list = $('quests-list');
    list.innerHTML = '';
    const info = document.createElement('div');
    info.style.cssText = 'font-size:11px;color:#999;text-align:center;margin-bottom:14px;font-family:sans-serif;';
    info.textContent = 'Квесты сбрасываются через 24 часа после получения награды';
    list.appendChild(info);

    const META = {
        playMinute: { name: 'Наиграть минуту', icon: 'fa-clock' },
        play5min:   { name: 'Наиграть 5 минут', icon: 'fa-clock' },
        play15min:  { name: 'Наиграть 15 минут', icon: 'fa-clock' },
        kill100:    { name: 'Убить 100 врагов', icon: 'fa-skull' },
        kill500:    { name: 'Убить 500 врагов', icon: 'fa-skull-crossbones' },
        wave10:     { name: 'Дойти до 10 волны', icon: 'fa-water' },
        bossSlay:   { name: 'Убить 3 боссов', icon: 'fa-crown' }
    };

    for (const k in STATE.quests) {
        const q = STATE.quests[k], meta = META[k];
        const done = q.prog >= q.goal;
        const item = document.createElement('div');
        item.className = 'quest-item' + (done && !q.claimed ? ' done' : '');
        const claimBtn = q.claimed
            ? '<button class="quest-claim" disabled>✓</button>'
            : (done
                ? `<button class="quest-claim" data-claim="${k}">ЗАБРАТЬ</button>`
                : '<button class="quest-claim" disabled>—</button>');
        item.innerHTML = `
            <div class="quest-icon"><i class="fa-solid ${meta.icon}"></i></div>
            <div class="quest-info">
                <h5>${meta.name}</h5>
                <div class="quest-progress"><i style="width:${(q.prog / q.goal) * 100}%"></i></div>
                <div style="font-size:10px;color:#888;margin-top:4px;">${q.prog} / ${q.goal}</div>
            </div>
            <div style="text-align:right;">
                <div class="quest-reward">+${q.reward}💰</div>
                ${claimBtn}
            </div>`;
        list.appendChild(item);
    }
    show('quests-modal');
}

function claimQuest(k) {
    const q = STATE.quests[k];
    if (q.prog < q.goal || q.claimed) return;
    STATE.coins += q.reward;
    q.claimed = true;
    q.resetAt = Date.now() + 24 * 60 * 60 * 1000;
    saveGame(); updateUI(); openQuests();
}

// ============================================================
// === PROFILE ===
// ============================================================
function openProfile() {
    if (!HAS_TG_API) {
        $('profile-name').textContent = 'Гость';
        $('profile-username').textContent = 'Нет доступа к Telegram API';
        $('profile-id').textContent = '—';
        $('profile-avatar').textContent = '?';
        show('profile-modal');
        return;
    }
    const avatar = $('profile-avatar');
    const name = ((TG_USER.first_name || '') + ' ' + (TG_USER.last_name || '')).trim() || 'Гость';
    $('profile-name').textContent = name;
    $('profile-username').textContent = TG_USER.username ? '@' + TG_USER.username : '@player';
    $('profile-id').textContent = TG_USER.id || '—';
    if (TG_USER.photo_url) {
        const img = new Image();
        img.onload = () => { avatar.innerHTML = ''; avatar.appendChild(img); };
        img.src = TG_USER.photo_url;
    } else {
        avatar.textContent = (name[0] || '?').toUpperCase();
    }
    show('profile-modal');
}

// ============================================================
// === VISIBILITY ===
// ============================================================
document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
        if (STATE.isPlaying) STATE.isPaused = true;
        saveGame(true);
    } else {
        lastFrameTime = performance.now();
    }
});

// ============================================================
// === EVENT BINDINGS ===
// ============================================================
window.addEventListener('load', () => {
    $('btn-play').addEventListener('click', () => { haptic('medium'); startGame(); });
    // Removed btn-quests from menu
    $('btn-profile').addEventListener('click', () => { haptic('light'); openProfile(); });

    if (!HAS_TG_API) {
        const btn = $('btn-profile');
        btn.classList.add('soon');
        if (!btn.querySelector('.soon-sub')) {
            const span = document.createElement('span');
            span.className = 'soon-sub';
            span.textContent = 'Нет доступа к Telegram API';
            btn.appendChild(span);
        }
    }

    // Game Quests Button
    $('btn-quests-game').addEventListener('click', () => { haptic('light'); openQuests(); });
    $('btn-upgrades').addEventListener('click', () => { haptic('light'); openUpgrades(); });
    $('btn-shop').addEventListener('click', () => { haptic('light'); openShop(); });
    $('btn-index').addEventListener('click', () => { haptic('light'); openIndex(); });
    $('btn-pause').addEventListener('click', togglePause);

    // Abilities only shoot now
    $('ability-slot-0').addEventListener('click', () => onAbilityClick(0));
    $('ability-slot-1').addEventListener('click', () => onAbilityClick(1));
    $('auto-btn').addEventListener('click', () => { haptic('light'); toggleAuto(); });

    $('close-upgrades').addEventListener('click', () => closeModal('upgrades-modal'));
    $('close-shop').addEventListener('click', () => closeModal('shop-modal'));
    $('close-case').addEventListener('click', () => closeModal('case-modal'));
    $('close-ability-case').addEventListener('click', () => closeModal('ability-case-modal'));
    $('close-index').addEventListener('click', () => closeModal('index-modal'));
    $('close-profile').addEventListener('click', () => closeModal('profile-modal'));
    $('close-quests').addEventListener('click', () => closeModal('quests-modal'));

    $('tab-weapons').addEventListener('click', () => switchIndexTab('weapons'));
    $('tab-abilities').addEventListener('click', () => switchIndexTab('abilities'));
    $('tab-builder').addEventListener('click', () => switchIndexTab('builder'));

    $('pause-resume').addEventListener('click', togglePause);
    $('pause-restart').addEventListener('click', restartWave);
    $('pause-menu-btn').addEventListener('click', goToMenu);

    $('go-restart').addEventListener('click', restartWave);
    $('go-menu').addEventListener('click', goToMenu);

    document.addEventListener('click', (e) => {
        const buy = e.target.closest('[data-buy]');
        if (buy) {
            const type = buy.getAttribute('data-buy');
            if (type === 'case' && STATE.coins >= 200) {
                STATE.coins -= 200; saveGame(); updateUI();
                closeModal('shop-modal');
                setTimeout(() => openCase(false), 100);
            }
            if (type === 'ability-case' && STATE.coins >= 20) {
                STATE.coins -= 20; saveGame(); updateUI();
                closeModal('shop-modal');
                setTimeout(() => openAbilityCase(), 100);
            }
            return;
        }
        const buyUp = e.target.closest('[data-buy-upgrade]');
        if (buyUp) { buyUpgrade(buyUp.getAttribute('data-buy-upgrade')); return; }
        const claim = e.target.closest('[data-claim]');
        if (claim) { claimQuest(claim.getAttribute('data-claim')); return; }
    });

    updateUI();
    updateAbilityUI();
    $('auto-btn').classList.toggle('active', STATE.autoUse);
});
</script>
</body>
</html>
